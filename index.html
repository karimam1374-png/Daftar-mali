<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>دفتر شخصی</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#17313b">
<style>
@font-face{font-family:BN;src:url(b-nazanin.ttf)}
:root{--bg:#f5f1ff;--c:#fff;--t:#2a1f4d;--m:#6f6a8f;--b:#e4def7;--p:#7c3aed;--r:#e11d48;--o:#b45309;--g:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#1a1433;--c:#251d47;--t:#f1edff;--m:#b3acd9;--b:#3a2f66;--p:#a78bfa;--r:#fb7185;--o:#fbbf24;--g:#4ade80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:18px/1.8 BN,Tahoma,system-ui,sans-serif;padding-bottom:80px}
header{background:linear-gradient(120deg,#7c3aed,#db2777 70%,#f59e0b);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 14px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 22px 22px}header b{font-size:26px}header small{font-size:16px;opacity:.92}
main{max-width:720px;margin:0 auto;padding:12px}h3{margin:16px 0 6px;font-size:19px}.m{color:var(--m);font-size:15px;margin:4px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tl{border-radius:16px;padding:8px 14px;color:#fff;display:flex;flex-direction:column;position:relative}.tl span{font-size:15px;opacity:.93}.tl b{font-size:27px;line-height:1.3}.tl .ic{position:absolute;left:4px;top:4px;color:#fff}
.cd2{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:6px 14px 10px;margin:10px 0}.cd2 h3{margin:6px 0}.h{display:flex;justify-content:space-between;align-items:center}
.r{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:6px 0;background:var(--c);border:1px solid var(--b);border-inline-start:6px solid var(--rc,var(--p));border-radius:12px}.r .n{flex:1;display:flex;flex-direction:column;min-width:0}.r small{color:var(--m);font-size:14px}.a{font-weight:700;white-space:nowrap}.dn2 .n b{text-decoration:line-through;opacity:.6}
input[type=checkbox]{width:24px;height:24px;accent-color:#15803d}
.ic{background:none;border:0;font-size:18px;padding:4px;cursor:pointer;color:inherit}
.bt{display:block;width:100%;margin:10px 0;padding:11px;border:2px dashed var(--p);background:none;color:var(--p);border-radius:14px;font:inherit;font-weight:700;cursor:pointer;text-align:center}
.neg{color:var(--r)}.wn{color:var(--o)}.ok{color:var(--g)}
.bar,.pb{height:10px;background:var(--b);border-radius:5px;overflow:hidden;margin:6px 0}.bar i,.pb u{display:block;height:100%;border-radius:5px;background:var(--g)}.pb u.neg{background:#e11d48}.pb u.wn{background:#f59e0b}.pb{height:8px;margin:3px 0 0}
.ch{display:flex;align-items:center;gap:12px}.dn{width:132px;flex:none}.lg{display:flex;flex-direction:column;font-size:16px}.lg s{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px}
.hb{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:8px;font-size:16px;margin:4px 0}.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb i{height:14px;background:var(--b);border-radius:7px;overflow:hidden}.hb u{display:block;height:100%;border-radius:7px}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}nav button{flex:1;padding:10px 4px;border:0;background:none;color:var(--m);font:inherit;font-size:17px;border-top:4px solid transparent}nav button.on{color:var(--p);border-top-color:var(--p);font-weight:700}
footer{display:flex;gap:8px;margin-top:20px}footer .bt{margin:0;border-style:solid}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
</style></head><body>
<header><b>دفتر شخصی</b><small id="dt"></small></header><main id="v"></main>
<nav><button data-a="t:i" data-t="i">💰 اقساط ماهانه</button><button data-a="t:l" data-t="l">🏦 وام‌ها</button><button data-a="t:c" data-t="c">🚗 خودرو</button></nav>
<script>
const K='dafter1',$=s=>document.querySelector(s),f=n=>(+n||0).toLocaleString('fa-IR'),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NUM=s=>+String(s==null?'':s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬،\s]/g,'')||0;
const ask=(m,v)=>{const r=prompt(m,v==null?'':v);return r===null?null:r.trim()},jd=()=>new Date().toLocaleDateString('fa-IR-u-ca-persian'),jm=()=>new Date().toLocaleDateString('fa-IR-u-ca-persian',{month:'long',year:'numeric'});
const D0={tab:'i',inst:{label:'',sal:0,items:[]},loans:[],car:{km:0,items:[],notes:[]}};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||JSON.parse(JSON.stringify(D0));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const PAL=['#7c3aed','#e11d48','#0d9488','#f59e0b','#0284c7','#db2777','#16a34a','#ea580c'];
const donut=(a,t,u)=>{const T=a.reduce((x,y)=>x+y.v,0)||1,L=238.76;let o=0;return `<svg viewBox="0 0 100 100" class="dn" role="img"><circle cx="50" cy="50" r="38" fill="none" stroke="var(--b)" stroke-width="14"/>`+a.map(x=>{const l=x.v/T*L,e=x.v>0?`<circle cx="50" cy="50" r="38" fill="none" stroke="${x.c}" stroke-width="14" stroke-dasharray="${l} ${L-l}" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"/>`:'';o+=l;return e}).join('')+`<text x="50" y="52" text-anchor="middle" font-size="17" fill="currentColor" font-weight="700">${t}</text><text x="50" y="67" text-anchor="middle" font-size="9" fill="var(--m)">${u}</text></svg>`};
const leg=a=>`<div class="lg">`+a.map(x=>`<span><s style="background:${x.c}"></s>${x.n}: ${f(x.v)}</span>`).join('')+`</div>`;
const bars=a=>{const mx=Math.max(...a.map(x=>x.v),1);return a.map((x,i)=>`<div class="hb"><span>${E(x.n)}</span><i><u style="width:${Math.round(x.v*100/mx)}%;background:${PAL[i%8]}"></u></i><b>${f(x.v)}</b></div>`).join('')};
const tile=(l,v,c,x)=>`<div class="tl" style="background:${c}"><span>${l}</span><b>${v}</b>${x||''}</div>`;
function vi(){const I=S.inst,it=I.items,sm=(k,d)=>it.filter(x=>x.k==k&&(!d||x.d)).reduce((s,x)=>s+x.a,0),P=sm('p'),Rc=sm('r'),pd=sm('p',1),rem=I.sal-(P-Rc),pc=P?Math.round(pd*100/P):0;
const row=(x,i)=>`<div class="r ${x.d?'dn2':''}" style="--rc:${x.k=='r'?'#0d9488':x.d?'#16a34a':'#e11d48'}"><input type="checkbox" ${x.d?'checked':''} data-a="tg:${i}" aria-label="انجام شد"><div class="n"><b>${E(x.n)}</b><small>${[x.t,x.l&&'آخرین قسط: '+x.l].filter(Boolean).map(E).join(' — ')}</small></div><span class="a">${f(x.a)}</span><button class="ic" data-a="ed:${i}" aria-label="ویرایش">✏️</button><button class="ic" data-a="rm:${i}" aria-label="حذف">🗑</button></div>`;
const sec=(k,h)=>`<h3>${h}</h3>`+(it.map((x,i)=>x.k==k?row(x,i):'').join('')||'<p class="m">موردی ثبت نشده.</p>')+`<button class="bt" data-a="add:${k}">＋ افزودن</button>`;
const top=it.filter(x=>x.k=='p').sort((a,b)=>b.a-a.a).slice(0,6).map(x=>({n:x.n,v:x.a})),ds=[{n:'پرداخت‌شده',v:pd,c:'#16a34a'},{n:'مانده',v:P-pd,c:'#e11d48'}];
return `<div class="g">${tile('حقوق',f(I.sal),'#7c3aed','<button class="ic" data-a="sal" aria-label="ویرایش حقوق">✏️</button>')}${tile('جمع پرداخت‌ها',f(P),'#e11d48')}${tile('دریافتی‌ها',f(Rc),'#0f766e')}${tile('باقی‌مانده',f(rem),rem<0?'#9f1239':'#15803d')}${tile('سهم هر هفته',f(Math.round(rem/4)),'#0369a1')}${tile('هنوز پرداخت نشده',f(P-pd),'#b45309')}</div><p class="m">مبالغ به هزار تومان${I.label?' — '+E(I.label):''}</p>`+(P?`<div class="cd2"><h3>پیشرفت پرداخت‌های این ماه</h3><div class="ch">${donut(ds,f(pc)+'٪','پرداخت شد')}${leg(ds)}</div></div><div class="cd2"><h3>بزرگ‌ترین پرداخت‌ها</h3>${bars(top)}</div>`:'')+sec('p','پرداخت‌ها')+sec('r','دریافتی‌ها')+`<button class="bt" data-a="month">شروع ماه جدید (تیک‌ها پاک می‌شود)</button>`}
function vl(){const T=S.loans.reduce((s,l)=>s+l.t,0),pd=S.loans.reduce((s,l)=>s+l.p.reduce((a,x)=>a+x.a,0),0),pc=T?Math.round(pd*100/T):0,ds=[{n:'پرداخت‌شده',v:pd,c:'#16a34a'},{n:'مانده',v:Math.max(0,T-pd),c:'#e11d48'}];
return (S.loans.length?`<div class="cd2"><h3>وضعیت همه‌ی وام‌ها</h3><div class="ch">${donut(ds,f(pc)+'٪','تسویه شده')}${leg(ds)}</div></div>`:'')+(S.loans.map((l,i)=>{const p=l.p.reduce((s,x)=>s+x.a,0),q=l.t?Math.min(100,Math.round(p*100/l.t)):0,c=PAL[i%8];return `<div class="cd2" style="border-inline-start:6px solid ${c}"><div class="h"><b>${E(l.n)}</b><span><button class="ic" data-a="le:${i}" aria-label="ویرایش">✏️</button><button class="ic" data-a="lr:${i}" aria-label="حذف">🗑</button></span></div><div class="bar"><i style="width:${q}%;background:${c}"></i></div><p class="m">کل ${f(l.t)} — پرداخت‌شده ${f(p)} — مانده <b>${f(l.t-p)}</b> (${f(q)}٪)</p>${l.p.map((x,j)=>`<div class="r" style="--rc:${c}"><div class="n">${E(x.d)}</div><span class="a">${f(x.a)}</span><button class="ic" data-a="lx:${i}|${j}" aria-label="حذف قسط">🗑</button></div>`).join('')}<button class="bt" data-a="lp:${i}">＋ ثبت قسط پرداخت‌شده</button></div>`}).join('')||'<p class="m">وامی ثبت نشده.</p>')+`<button class="bt" data-a="la">＋ وام جدید</button><p class="m">مبالغ به هزار تومان.</p>`}
function vc(){const c=S.car,km=c.km,o=c.items.map((x,i)=>({x,i,r:x.x?x.x-km:null})).sort((a,b)=>(a.r==null)-(b.r==null)||a.r-b.r),n={late:0,soon:0,ok:0,unk:0};
o.forEach(({r})=>{n[!km||r==null?'unk':r<=0?'late':r<1000?'soon':'ok']++});const ds=[{n:'گذشته',v:n.late,c:'#e11d48'},{n:'نزدیک',v:n.soon,c:'#f59e0b'},{n:'سالم',v:n.ok,c:'#16a34a'},{n:'ثبت نشده',v:n.unk,c:'#b9b3d6'}];
return `<div class="g">${tile('کیلومتر فعلی',km?f(km):'ثبت نشده','#7c3aed','<button class="ic" data-a="km" aria-label="ویرایش کیلومتر">✏️</button>')}${tile('موعد گذشته یا نزدیک',f(n.late+n.soon),n.late?'#e11d48':'#0369a1')}</div>`+(c.items.length?`<div class="cd2"><h3>وضعیت سرویس‌ها</h3><div class="ch">${donut(ds,f(c.items.length),'مورد')}${leg(ds)}</div></div>`:'')+`<h3>سرویس‌ها و قطعات</h3>`+o.map(({x,i,r})=>{const cl=!km||r==null?'':r<=0?'neg':r<1000?'wn':'ok',tx=r==null?'ثبت نشده':!km?'':r<=0?f(-r)+' کیلومتر گذشته':f(r)+' کیلومتر مانده',pc=km&&x.x&&x.e?Math.max(0,Math.min(100,Math.round((km-(x.x-x.e))*100/x.e))):0;return `<div class="r" style="--rc:${cl=='neg'?'#e11d48':cl=='wn'?'#f59e0b':cl=='ok'?'#16a34a':'#b9b3d6'}"><div class="n"><b>${E(x.n)}</b><small>آخرین: ${x.l?f(x.l):'—'} — بعدی: ${x.x?f(x.x):'—'} — هر ${f(x.e)}</small><i class="pb"><u class="${cl}" style="width:${pc}%"></u></i></div><span class="a ${cl}">${tx}</span><button class="ic" data-a="cd:${i}" aria-label="انجام شد">✔️</button><button class="ic" data-a="ce:${i}" aria-label="ویرایش">✏️</button><button class="ic" data-a="cr:${i}" aria-label="حذف">🗑</button></div>`}).join('')+`<button class="bt" data-a="ca">＋ مورد جدید</button><h3>سایر توضیحات و تعمیرات</h3>`+c.notes.map((n,i)=>`<div class="r" style="--rc:#0284c7"><div class="n"><small>${E(n.d)}</small>${E(n.t)}</div><button class="ic" data-a="nr:${i}" aria-label="حذف">🗑</button></div>`).join('')+`<button class="bt" data-a="na">＋ یادداشت جدید</button>`}
function R(){const em=!S.inst.items.length&&!S.loans.length&&!S.car.items.length;$('#v').innerHTML=(em?'<p class="m">برای شروع، «بازیابی» پایین صفحه را بزنید و فایل پشتیبان را انتخاب کنید، یا موردها را با دکمه‌ی «افزودن» وارد کنید.</p>':'')+({i:vi,l:vl,c:vc})[S.tab]()+`<footer><button class="bt" data-a="bk">پشتیبان‌گیری</button><label class="bt" style="margin:0;border-style:solid">بازیابی<input type="file" accept=".json" id="rs" hidden></label></footer>`;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const[a,v]=b.dataset.a.split(':'),i=+v,I=S.inst,C=S.car;
if(a=='t')S.tab=v;else if(a=='tg')I.items[i].d^=1;
else if(a=='ed'){const x=I.items[i],n=ask('عنوان',x.n),m=n===null?null:ask('مبلغ (هزار تومان)',x.a),t=m===null?null:ask('توضیحات',x.t),l=t===null?null:ask('آخرین قسط (اختیاری)',x.l);if(l===null)return;Object.assign(x,{n:n||x.n,a:NUM(m),t,l})}
else if(a=='rm'){if(!confirm('این مورد حذف شود؟'))return;I.items.splice(i,1)}
else if(a=='add'){const n=ask('عنوان');if(!n)return;const m=ask('مبلغ (هزار تومان)');if(m===null)return;I.items.push({n,a:NUM(m),k:v,t:'',l:'',d:0})}
else if(a=='sal'){const m=ask('حقوق ماهانه (هزار تومان)',I.sal);if(m===null)return;I.sal=NUM(m)}
else if(a=='month'){const l=ask('نام ماه جدید',jm());if(l===null)return;I.label=l;I.items.forEach(x=>x.d=0)}
else if(a=='la'){const n=ask('عنوان وام');if(!n)return;const t=ask('مبلغ کل (هزار تومان)');if(t===null)return;S.loans.push({n,t:NUM(t),p:[]})}
else if(a=='le'){const l=S.loans[i],n=ask('عنوان وام',l.n),t=n===null?null:ask('مبلغ کل (هزار تومان)',l.t);if(t===null)return;l.n=n||l.n;l.t=NUM(t)}
else if(a=='lr'){if(!confirm('این وام و همه‌ی اقساطش حذف شود؟'))return;S.loans.splice(i,1)}
else if(a=='lp'){const m=ask('مبلغ قسط (هزار تومان)');if(!m||!NUM(m))return;const d=ask('تاریخ',jd());if(d===null)return;S.loans[i].p.push({d,a:NUM(m)})}
else if(a=='lx'){const[x,y]=v.split('|');if(!confirm('این قسط حذف شود؟'))return;S.loans[x].p.splice(y,1)}
else if(a=='km'){const m=ask('کیلومتر فعلی',C.km||'');if(m===null)return;C.km=NUM(m)}
else if(a=='cd'){const x=C.items[i];if(!C.km){const m=ask('کیلومتر فعلی');if(!m)return;C.km=NUM(m)}if(!x.e){const m=ask('هر چند کیلومتر یک بار؟');if(!m)return;x.e=NUM(m)}x.l=C.km;x.x=C.km+x.e}
else if(a=='ce'){const x=C.items[i],n=ask('عنوان',x.n),l=n===null?null:ask('کیلومتر آخرین انجام',x.l),y=l===null?null:ask('کیلومتر بعدی',x.x),z=y===null?null:ask('فاصله‌ی هر بار (کیلومتر)',x.e);if(z===null)return;Object.assign(x,{n:n||x.n,l:NUM(l),x:NUM(y),e:NUM(z)})}
else if(a=='cr'){if(!confirm('این مورد حذف شود؟'))return;C.items.splice(i,1)}
else if(a=='ca'){const n=ask('عنوان');if(!n)return;const z=ask('هر چند کیلومتر یک بار؟');if(z===null)return;C.items.push({n,l:0,x:0,e:NUM(z)})}
else if(a=='na'){const t=ask('توضیحات');if(!t)return;const d=ask('تاریخ',jd());if(d===null)return;C.notes.unshift({d,t})}
else if(a=='nr'){if(!confirm('این یادداشت حذف شود؟'))return;C.notes.splice(i,1)}
else if(a=='bk'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),k=document.createElement('a');k.href=u;k.download='dafter-'+Date.now()+'.json';k.click();return}
else return;save();R()});
document.addEventListener('change',e=>{if(e.target.id!='rs'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.inst||!d.loans||!d.car)throw 0;if(!confirm('داده‌های فعلی با فایل پشتیبان جایگزین شود؟'))return;S=d;save();R()}catch(x){alert('فایل پشتیبان معتبر نیست.')}};r.readAsText(e.target.files[0])});
$('#dt').textContent=jd();R();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
